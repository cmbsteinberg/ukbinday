name: Uptime

# Production checks, every 30 minutes (the refresh-keeping-up check runs once a day, 07:15 UTC,
# after the 05:00–05:30 Vercel cron refreshes). A failed scheduled run emails whoever last
# changed this schedule (GitHub's default notification), which is the alert.
# GitHub disables schedules in a public repo after 60 days without commits; re-enable
# it from the Actions tab if that happens.
on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "15 7 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://ukbinday.co.uk/api/v2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4

      - name: Address lookup returns addresses
        # /find only calls the address API behind Turnstile, so run the lookup from main's code.
        # Catches a broken session token (e87bb53) or the upstream API changing shape.
        env:
          ADDRESS_API_URL: https://www.midsuffolk.gov.uk/api/jsonws/invoke
          ADDRESS_API_COMPANY_ID: "1486681"
        run: |
          uv run python -c "
          import asyncio
          from api.services.address_lookup import search_addresses
          n = len(asyncio.run(search_addresses('RH16 1LG')))
          print(f'RH16 1LG: {n} addresses')
          assert n > 0, 'address lookup returned nothing'
          " || { echo "::error::address lookup for RH16 1LG failed"; exit 1; }

      - name: Site answers
        run: |
          # Retry so one slow cold start doesn't send an email
          curl -sS --fail --retry 3 --retry-all-errors --retry-delay 20 --max-time 30 -o /dev/null "$BASE/status"

      - name: Nightly refresh ran in the last 36 h
        run: |
          metrics="$(curl -sS --fail --retry 3 --retry-all-errors --retry-delay 20 --max-time 30 "$BASE/metrics")"
          age="$(echo "$metrics" | jq -r '.ics_cache.last_refresh_age_seconds // empty')"
          echo "refresh heartbeat age: ${age:-none}s"
          [ -n "$age" ] && [ "$age" -lt 129600 ] || { echo "::error::refresh heartbeat missing or older than 36 h"; exit 1; }

      - name: Nightly refresh reached every due calendar
        if: github.event.schedule == '15 7 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          metrics="$(curl -sS --fail --retry 3 --retry-all-errors --retry-delay 20 --max-time 30 "$BASE/metrics")"
          echo "$metrics" | jq -e '
            .ics_cache | .shards_expected == 4 and
            (.last_refresh_stats | keys | sort) == ["0", "1", "2", "3"]
          ' > /dev/null || { echo "::error::refresh heartbeat missing an expected shard"; exit 1; }
          deferred="$(echo "$metrics" | jq -r '[.ics_cache.last_refresh_stats // {} | .[] | .deferred // 0] | add // 0')"
          echo "deferred calendars across shards: $deferred"
          [ "$deferred" -eq 0 ] || { echo "::error::nightly refresh hit its deadline with $deferred calendars deferred"; exit 1; }
