name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # the Coverage workflow redeploys after committing its results

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Smoke tests
        run: uv run pytest tests/test_ci.py -v

  # Vercel production deploy. Vercel's own Git deploys are off (vercel.json
  # `git.deploymentEnabled`), so this job is the only way to production and needs a
  # passing smoke test. Missing credentials fail the job.
  deploy-vercel:
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID is not set"
            exit 1
          fi

      - uses: actions/checkout@v4

      # Vercel builds from the upload, which honours .vercelignore (and never includes
      # .env* files); a local `vercel build` put ignored root files in the function.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        run: npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
