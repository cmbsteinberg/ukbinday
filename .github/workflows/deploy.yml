name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Smoke tests
        run: uv run pytest tests/test_ci.py -v

  # Vercel production deploy. Skips (green) until the VERCEL_TOKEN secret exists, so this
  # can merge before the project is set up. Vercel's own Git deploys are off
  # (vercel.json `git.deploymentEnabled`), so this job is the only way to production and
  # needs a passing smoke test.
  deploy-vercel:
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel credentials
        id: gate
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Vercel deploy: VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID is not set"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      # Vercel builds from the upload, which honours .vercelignore (and never includes
      # .env* files); a local `vercel build` put ignored root files in the function.
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22

      - name: Deploy
        if: steps.gate.outputs.enabled == 'true'
        run: npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
