services:
  api:
    build: .
    ports:
    - 8000:8000
    mem_limit: 4g
    environment:
    - RUN_REFRESH_JOB=0
    - BASE_URL=${BASE_URL:-}
    - LOG_LEVEL=${LOG_LEVEL:-INFO}
    - LOG_FORMAT=${LOG_FORMAT:-json}
    - CORS_ORIGINS=${CORS_ORIGINS:-}
    - SCRAPER_TIMEOUT=${SCRAPER_TIMEOUT:-30}
    - CACHE_TTL=${CACHE_TTL:-50400}
    - ADDRESS_API_URL=${ADDRESS_API_URL:-}
    - ADDRESS_API_COMPANY_ID=${ADDRESS_API_COMPANY_ID:-}
    - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
    - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
    - DATA_DIR=${DATA_DIR:-/app/data}
    - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
    - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
    - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
    - R2_BUCKET=${R2_BUCKET:-}
    - ICS_RETENTION_DAYS=${ICS_RETENTION_DAYS:-365}
    - ICS_REFRESH_HOUR_UTC=${ICS_REFRESH_HOUR_UTC:-3}
    - ICS_REFRESH_CONCURRENCY=${ICS_REFRESH_CONCURRENCY:-4}
    - ICS_FAILURE_THRESHOLD=${ICS_FAILURE_THRESHOLD:-14}
    volumes:
    - bins_data:/app/data
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/status')
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
volumes:
  bins_data:
